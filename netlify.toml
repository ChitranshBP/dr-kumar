[build]
  command  = "php build.php"
  publish  = "dist"

[build.environment]
  PHP_VERSION = "8.1"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
